# Keeps the pinned action commits up to date. Swift packages are pinned on purpose
# (ycode/Package.resolved, exact versions in frameworks/) and updated by hand.
version: 2
updates:
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/setup-swift
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: CI
